<g fill="none" stroke="#6fe0dc" stroke-opacity=".45"><circle cx="870" cy="180" r="12"><animate attributeName="r" values="10;28;10" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;.08;.7" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="870" cy="180" r="6" fill="#6fe0dc" stroke="none"/></g>
<circle cx="995" cy="229" r="6" fill="#ff8b4c"/><circle cx="995" cy="229" r="12" fill="none" stroke="#ff8b4c" stroke-opacity=".4"><animate attributeName="r" values="9;18;9" dur="2.8s" repeatCount="indefinite"/></circle>
<text x="66" y="78" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="35" font-weight="700">JUAN ESTEBAN BERON ZAPATA</text>
<text x="66" y="119" fill="#d3e0e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600">Autonomous Aerospace Systems</text>
<text x="66" y="151" fill="#91aabd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5">Dynamic &amp; degraded environments · resilient mission execution · simulation-to-hardware validation</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600">
<g transform="translate(66 193)"><rect width="104" height="34" rx="17" fill="#6fe0dc" fill-opacity=".10" stroke="#6fe0dc" stroke-opacity=".42"/><text x="52" y="22" text-anchor="middle" fill="#acebe8">SENSE</text></g>
<g transform="translate(184 193)"><rect width="116" height="34" rx="17" fill="#80a9c2" fill-opacity=".09" stroke="#80a9c2" stroke-opacity=".38"/><text x="58" y="22" text-anchor="middle" fill="#c9dae4">ESTIMATE</text></g>
<g transform="translate(314 193)"><rect width="106" height="34" rx="17" fill="#ffc45f" fill-opacity=".10" stroke="#ffc45f" stroke-opacity=".42"/><text x="53" y="22" text-anchor="middle" fill="#ffe0a4">DECIDE</text></g>
<g transform="translate(434 193)"><rect width="92" height="34" rx="17" fill="#ff8b4c" fill-opacity=".11" stroke="#ff8b4c" stroke-opacity=".44"/><text x="46" y="22" text-anchor="middle" fill="#ffc3a1">ACT</text></g>
<g transform="translate(540 193)"><rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".20"/><text x="75" y="22" text-anchor="middle" fill="#dce5eb">RECONFIGURE</text></g>
</g>
<text x="66" y="268" fill="#8199aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" letter-spacing=".9">SAFETY-CRITICAL CONTROL  ·  MULTI-ROBOT SYSTEMS  ·  EMBEDDED SENSING  ·  HARDWARE TESTING</text>
