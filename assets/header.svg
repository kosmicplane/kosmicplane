<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Juan Esteban Beron Zapata — Autonomous Aerospace Systems</title>
<desc id="desc">Animated autonomous aerospace mission with orbital motion, sensing, contingency branching, and hardware validation.</desc>
<defs>
<linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#050b14"/><stop offset="52%" stop-color="#0a1827"/><stop offset="100%" stop-color="#102d3c"/></linearGradient>
<linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff7a2f"/><stop offset="52%" stop-color="#ffc45f"/><stop offset="100%" stop-color="#6fe0dc"/></linearGradient>
<radialGradient id="planet" cx="38%" cy="20%" r="80%"><stop offset="0%" stop-color="#4d95b8"/><stop offset="38%" stop-color="#1e5872"/><stop offset="72%" stop-color="#0d2e43"/><stop offset="100%" stop-color="#071421"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#b9d6e8" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1200" height="340" rx="26" fill="url(#space)"/><rect width="1200" height="340" rx="26" fill="url(#grid)"/>
<g fill="#fff"><circle cx="930" cy="52" r="1.3"><animate attributeName="opacity" values=".18;.9;.18" dur="4.1s" repeatCount="indefinite"/></circle><circle cx="1080" cy="92" r="1.8"><animate attributeName="opacity" values=".15;1;.15" dur="5.6s" repeatCount="indefinite"/></circle><circle cx="1005" cy="154" r="1.2"><animate attributeName="opacity" values=".2;.8;.2" dur="3.7s" repeatCount="indefinite"/></circle><circle cx="1140" cy="202" r="1.5"><animate attributeName="opacity" values=".18;.95;.18" dur="4.9s" repeatCount="indefinite"/></circle></g>
<circle cx="1115" cy="420" r="260" fill="url(#planet)" stroke="#6fd6d3" stroke-opacity=".22" stroke-width="2"/>
<path d="M881 305 C970 250 1082 236 1198 259" fill="none" stroke="#7fe3df" stroke-opacity=".24" stroke-width="4"/>
<path id="traj" d="M650 260 C758 282 824 235 870 180 C916 126 984 92 1120 112" fill="none" stroke="url(#orbit)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="9 10"><animate attributeName="stroke-dashoffset" from="0" to="-38" dur="2.6s" repeatCount="indefinite"/></path>
