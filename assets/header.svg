<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Juan Esteban Beron Zapata — Autonomous Aerospace Systems</title>
  <desc id="desc">Animated aerospace trajectory with research focus areas.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1b2b"/>
      <stop offset="100%" stop-color="#10283a"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff7a2f"/>
      <stop offset="50%" stop-color="#f5b85a"/>
      <stop offset="100%" stop-color="#6fd6d3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>

  <g opacity=".45">
    <circle cx="1030" cy="52" r="2.3" fill="#fff"><animate attributeName="opacity" values=".2;1;.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1112" cy="106" r="1.8" fill="#fff"><animate attributeName="opacity" values=".15;.8;.15" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="955" cy="118" r="1.5" fill="#fff"><animate attributeName="opacity" values=".2;.9;.2" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="215" r="2.1" fill="#fff"><animate attributeName="opacity" values=".25;1;.25" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <path id="trajectory" d="M 76 226 C 230 252, 300 165, 442 185 S 650 236, 760 152 S 920 58, 1130 82"
        fill="none" stroke="url(#pathGrad)" stroke-width="3.5" stroke-linecap="round" opacity=".85"
        stroke-dasharray="9 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-38" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <circle r="7" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#trajectory"/>
    </animateMotion>
  </circle>

  <g fill="none" stroke="#6fd6d3" stroke-opacity=".45">
    <circle cx="760" cy="152" r="13"><animate attributeName="r" values="8;17;8" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="88" r="9"><animate attributeName="r" values="7;14;7" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <text x="72" y="86" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing=".5">
    JUAN ESTEBAN BERON ZAPATA
  </text>
  <text x="72" y="126" fill="#cdd8e3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500">
    Autonomous Aerospace Systems
  </text>
  <text x="72" y="161" fill="#90a5b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">
    Safety-Critical Control · Resilient Autonomy · Multi-Robot Systems · Simulation-to-Hardware Validation
  </text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing=".8">
    <rect x="72" y="196" width="150" height="31" rx="15.5" fill="#ff7a2f" fill-opacity=".13" stroke="#ff7a2f" stroke-opacity=".55"/>
    <text x="147" y="216" text-anchor="middle" fill="#ffc39f">CONTROL</text>

    <rect x="232" y="196" width="170" height="31" rx="15.5" fill="#f5b85a" fill-opacity=".10" stroke="#f5b85a" stroke-opacity=".48"/>
    <text x="317" y="216" text-anchor="middle" fill="#f7d79b">CONTINGENCY</text>

    <rect x="412" y="196" width="150" height="31" rx="15.5" fill="#6fd6d3" fill-opacity=".10" stroke="#6fd6d3" stroke-opacity=".45"/>
    <text x="487" y="216" text-anchor="middle" fill="#a8e7e5">ROBOTICS</text>

    <rect x="572" y="196" width="205" height="31" rx="15.5" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".22"/>
    <text x="674.5" y="216" text-anchor="middle" fill="#d3dce4">HARDWARE VALIDATION</text>
  </g>
</svg>